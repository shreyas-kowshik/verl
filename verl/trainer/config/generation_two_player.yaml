trainer:
  # Example generator resources
  example_nnodes: 1
  example_n_gpus_per_node: 1
  example_n_cpus_per_gpu: 4
  # Solution generator resources
  solution_nnodes: 1
  solution_n_gpus_per_node: 1
  solution_n_cpus_per_gpu: 4
  device: cuda

data:
  path: ~/data/rlhf/math/test.parquet
  prompt_key: prompt
  n_samples: 5
  output_path: /opt/tiger/math_Qwen2-7B-Instruct.parquet
  batch_size: 128

# Example Generator Model Configuration
example_model:
  path: ~/models/Qwen2-7B-Instruct  # Path to example generator model
  external_lib: null

# Example Generator Rollout Configuration
example_rollout:
  _target_: verl.workers.config.RolloutConfig
  name: vllm
  mode: sync  # sync: LLM, async: AsyncLLM
  temperature: 0.7
  top_k: 50  # 0 for hf rollout, -1 for vllm rollout
  top_p: 0.9
  prompt_length: 2048
  response_length: 1024
  # for vllm rollout
  dtype: bfloat16
  gpu_memory_utilization: 0.4
  ignore_eos: False
  enforce_eager: True
  free_cache_engine: True
  load_format: auto
  tensor_model_parallel_size: 1
  data_parallel_size: 1
  max_num_batched_tokens: 8192
  max_model_len: null
  max_num_seqs: 64
  log_prob_micro_batch_size: null
  log_prob_micro_batch_size_per_gpu: 8
  # for hf rollout
  do_sample: True
  disable_log_stats: True
  enable_chunked_prefill: True
  n: 1  # Should be 1 for example generator
  calculate_log_probs: False
  pipeline_model_parallel_size: 1

example_actor:
  strategy: fsdp
  ulysses_sequence_parallel_size: 1
  entropy_from_logits_with_chunking: False
  entropy_checkpointing: False
  ppo_mini_batch_size: 32  # Not used for generation, but required by worker
  ppo_micro_batch_size: 4  # Not used for generation, but required by worker
  ppo_micro_batch_size_per_gpu: 4  # Not used for generation
  fsdp_config:
    fsdp_size: -1
    forward_prefetch: False

# Solution Generator Model Configuration
solution_model:
  path: ~/models/Qwen2-7B-Instruct  # Path to solution generator model
  external_lib: null

# Solution Generator Rollout Configuration
solution_rollout:
  _target_: verl.workers.config.RolloutConfig
  name: vllm
  mode: sync
  temperature: 1.0
  top_k: 50
  top_p: 0.7
  prompt_length: 2048
  response_length: 1024
  # for vllm rollout
  dtype: bfloat16
  gpu_memory_utilization: 0.4
  ignore_eos: False
  enforce_eager: True
  free_cache_engine: True
  load_format: auto
  tensor_model_parallel_size: 1
  data_parallel_size: 1
  max_num_batched_tokens: 8192
  max_model_len: null
  max_num_seqs: 64
  log_prob_micro_batch_size: null
  log_prob_micro_batch_size_per_gpu: 8
  # for hf rollout
  do_sample: True
  disable_log_stats: True
  enable_chunked_prefill: True
  n: 1
  calculate_log_probs: False
  pipeline_model_parallel_size: 1

solution_actor:
  strategy: fsdp
  ulysses_sequence_parallel_size: 1
  entropy_from_logits_with_chunking: False
  entropy_checkpointing: False
  ppo_mini_batch_size: 32  # Not used for generation, but required by worker
  ppo_micro_batch_size: 4  # Not used for generation, but required by worker
  ppo_micro_batch_size_per_gpu: 4  # Not used for generation
  fsdp_config:
    fsdp_size: -1
    forward_prefetch: False

ray_kwargs:
  ray_init:
    num_cpus: 8  # 2 GPUs × 4 CPUs per GPU
    num_gpus: 2  # Total GPUs needed (example + solution)
  timeline_json_file: null

